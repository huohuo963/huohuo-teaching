<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数轴 · 相反数与绝对值 | 七上 第1章 有理数</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #fff;
    --ink: #1e2430;
    --ink2: #5a6474;
    --ink3: #8b94a3;
    --line: #e4e8ef;
    --brand: #2f6fed;
    --ghost: #e0762d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: rgba(255, 255, 255, .9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .bar a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .bar .crumb { color: var(--ink3); }
  main { max-width: 960px; margin: 0 auto; padding: 30px 20px 64px; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .01em; }
  h1 span { margin-left: 8px; font-size: 16px; font-weight: 500; color: var(--ink3); }
  .lead { margin: 0 0 22px; font-size: 14px; color: var(--ink2); }

  .stage {
    padding: 10px 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(20, 30, 50, .05), 0 10px 28px rgba(20, 30, 50, .06);
    touch-action: none;
  }
  svg { display: block; width: 100%; height: auto; cursor: grab; user-select: none; }
  svg:active { cursor: grabbing; }

  .readout {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 16px 0 0;
  }
  .card {
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .card dt { font-size: 12px; letter-spacing: .06em; color: var(--ink3); }
  .card dd {
    margin: 4px 0 0;
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .card.is-neg dd { color: var(--brand); }
  .card.is-abs dd { color: var(--ghost); }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  .controls button {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .controls button:hover { transform: translateY(-1px); border-color: #c6d0e0; }
  .controls button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--brand); }

  .explain {
    min-height: 56px;
    margin: 18px 0 0;
    padding: 14px 18px;
    background: #eef3fe;
    border: 1px solid #dbe5fd;
    border-radius: 14px;
    font-size: 14px;
    color: #243b66;
  }
  .explain b { color: #1b3f97; }

  .note {
    margin: 22px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 12.5px;
    color: var(--ink3);
  }
  .note b { color: var(--ink2); }

  @media (max-width: 640px) {
    h1 { font-size: 22px; }
    .readout { grid-template-columns: 1fr; gap: 8px; }
    .card { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .card dd { margin: 0; font-size: 20px; }
  }
</style>
</head>
<body>

<header class="bar">
  <a href="../../index.html">← 返回章节列表</a>
  <span class="crumb">七年级上册 · 第 1 章 有理数</span>
</header>

<main>
  <h1>数轴 <span>相反数与绝对值</span></h1>
  <p class="lead">拖动数轴上的蓝点，或使用下方按钮，观察「表示的数、相反数、绝对值」三者如何变化。</p>

  <section class="stage">
    <svg id="line" viewBox="0 0 900 230" aria-label="可交互数轴">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b4"></path>
        </marker>
      </defs>
      <g id="ticks"></g>
      <line x1="66" y1="120" x2="832" y2="120" stroke="#9aa4b4" stroke-width="2" marker-end="url(#arrow)"></line>
      <text x="842" y="112" font-size="13" fill="#8b94a3">x</text>
      <line id="distSeg" x1="450" y1="174" x2="450" y2="174" stroke="#e0762d" stroke-width="4" stroke-linecap="round"></line>
      <text id="distLabel" x="450" y="200" font-size="13" fill="#e0762d" text-anchor="middle"></text>
      <circle id="ghost" cx="450" cy="120" r="7" fill="none" stroke="#e0762d" stroke-width="2" stroke-dasharray="4 3" opacity="0"></circle>
      <g id="handle" transform="translate(450,120)">
        <circle r="11" fill="#fff" stroke="#2f6fed" stroke-width="2.5"></circle>
        <circle r="4" fill="#2f6fed"></circle>
        <text y="-24" font-size="14" font-weight="700" fill="#2f6fed" text-anchor="middle">P</text>
      </g>
    </svg>
  </section>

  <dl class="readout">
    <div class="card"><dt>点 P 表示的数 a</dt><dd id="vA">-3</dd></div>
    <div class="card is-neg"><dt>它的相反数 −a</dt><dd id="vN">+3</dd></div>
    <div class="card is-abs"><dt>绝对值 |a|（到原点距离）</dt><dd id="vAbs">3</dd></div>
  </dl>

  <div class="controls">
    <button type="button" data-act="minus">− 1</button>
    <input type="range" id="slider" min="-6" max="6" step="1" value="-3" aria-label="点的位置">
    <button type="button" data-act="plus">+ 1</button>
    <button type="button" data-act="flip" class="primary">取相反数</button>
    <button type="button" data-act="reset">回到原点</button>
  </div>

  <p class="explain" id="explain" aria-live="polite"></p>

  <p class="note"><b>结论：</b>数轴三要素是原点、正方向、单位长度；互为相反数的两个点在原点两侧，且到原点的距离相等；绝对值就是点到原点的距离，永远不小于 0。</p>
</main>

<script>
(function () {
  var CX = 450;
  var UNIT = 63.33;
  var MIN = -6;
  var MAX = 6;

  var svg = document.getElementById("line");
  var ticks = document.getElementById("ticks");
  var handle = document.getElementById("handle");
  var ghost = document.getElementById("ghost");
  var seg = document.getElementById("distSeg");
  var distLabel = document.getElementById("distLabel");
  var slider = document.getElementById("slider");
  var vA = document.getElementById("vA");
  var vN = document.getElementById("vN");
  var vAbs = document.getElementById("vAbs");
  var explain = document.getElementById("explain");

  var a = -3;

  function xOf(v) { return CX + v * UNIT; }
  function fmt(v) { return v > 0 ? "+" + v : String(v); }

  var NS = "http://www.w3.org/2000/svg";
  for (var v = MIN; v <= MAX; v++) {
    var tick = document.createElementNS(NS, "line");
    tick.setAttribute("x1", xOf(v));
    tick.setAttribute("x2", xOf(v));
    tick.setAttribute("y1", v === 0 ? 108 : 114);
    tick.setAttribute("y2", v === 0 ? 132 : 126);
    tick.setAttribute("stroke", v === 0 ? "#5a6474" : "#b7c0ce");
    tick.setAttribute("stroke-width", v === 0 ? 2 : 1.5);
    ticks.appendChild(tick);

    var label = document.createElementNS(NS, "text");
    label.setAttribute("x", xOf(v));
    label.setAttribute("y", 150);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("font-size", "13");
    label.setAttribute("fill", v === 0 ? "#5a6474" : "#8b94a3");
    label.textContent = v;
    ticks.appendChild(label);
  }

  function render() {
    handle.setAttribute("transform", "translate(" + xOf(a) + ",120)");
    slider.value = a;

    vA.textContent = fmt(a);
    vN.textContent = fmt(-a);
    vAbs.textContent = Math.abs(a);

    if (a === 0) {
      ghost.setAttribute("opacity", "0");
    } else {
      ghost.setAttribute("opacity", "1");
      ghost.setAttribute("cx", xOf(-a));
    }

    var x0 = xOf(0);
    var xa = xOf(a);
    seg.setAttribute("x1", Math.min(x0, xa));
    seg.setAttribute("x2", Math.max(x0, xa));
    distLabel.setAttribute("x", (x0 + xa) / 2);
    distLabel.textContent = a === 0 ? "" : "距离 = " + Math.abs(a);

    var where = a > 0 ? "<b>原点右侧</b>" : (a < 0 ? "<b>原点左侧</b>" : "与<b>原点重合</b>");
    var dist = Math.abs(a);
    explain.innerHTML =
      "点 P 在数轴上位于" + where + "，到原点的距离为 " + dist + " 个单位长度，" +
      "所以它表示的数 a = <b>" + fmt(a) + "</b>，相反数 −a = <b>" + fmt(-a) + "</b>，" +
      "绝对值 |a| = <b>" + dist + "</b>。";
  }

  function setA(v) {
    a = Math.max(MIN, Math.min(MAX, Math.round(v)));
    render();
  }

  var dragging = false;

  function valFromClientX(clientX) {
    var rect = svg.getBoundingClientRect();
    var sx = (clientX - rect.left) / rect.width * 900;
    return (sx - CX) / UNIT;
  }

  svg.addEventListener("pointerdown", function (e) {
    dragging = true;
    svg.setPointerCapture(e.pointerId);
    setA(valFromClientX(e.clientX));
  });

  svg.addEventListener("pointermove", function (e) {
    if (dragging) setA(valFromClientX(e.clientX));
  });

  svg.addEventListener("pointerup", function () { dragging = false; });
  svg.addEventListener("pointercancel", function () { dragging = false; });

  slider.addEventListener("input", function () { setA(+slider.value); });

  document.querySelector(".controls").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    if (act === "minus") setA(a - 1);
    if (act === "plus") setA(a + 1);
    if (act === "flip") setA(-a);
    if (act === "reset") setA(0);
  });

  render();
})();
</script>
</body>
</html>

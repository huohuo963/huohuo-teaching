<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【节号 节名】 | 【年级】</title>
<script>
  // 站点以 iframe 嵌入时会带 ?embed=1，隐藏本页顶栏，避免出现两条返回栏
  if (/[?&]embed=1/.test(location.search)) document.documentElement.className += " embed";
</script>
<!--
=================================================================
 单文件节模型模板（2024 新版人教版）
 1. 复制本文件到 models/<册>/<两位章号>/<节号>.html
    册：7a 七上 / 7b 七下 / 8a 八上 / 8b 八下 / 9a 九上 / 9b 九下
    示例：models/7b/07/7.2.2.html（七下第 7 章 7.2.2 平行线判定）
 2. 样式、脚本全部写在本文件内，不引用外部 CDN、外部图片；
    确需图片时使用 base64 内联，保证双击即可离线运行。
 3. 完成后打开 js/curriculum.js，给对应节加上 ready: true。
 4. 通用要求：适配手机、触摸可操作、正文中文；
    顶部保留返回链接（../../../index.html#ch=【章号】），
    并加 target="_top"，这样在站点 iframe 里点击也能回到整站。
 5. 配色沿用站点：纸色 #f5efe2 / 面板 #fffdf8 / 墨 #2b2419 /
    赭石 #a3541f / 土黄 #b9863c / 橘 #c46a2b，只做小面积点缀。
=================================================================
-->
<style>
  :root {
    --bg: #f5efe2;
    --panel: #fffdf8;
    --ink: #2b2419;
    --ink2: #5f5443;
    --ink3: #96886f;
    --line: #e0d5be;
    --brand: #a3541f;
    --brand-deep: #83401a;
    --accent: #c46a2b;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, Georgia, serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: rgba(245, 239, 226, .95);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .bar a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .bar a:hover { color: var(--brand-deep); }
  .bar .crumb { color: var(--ink3); }

  .embed .bar { display: none; }
  .embed main { padding-top: 18px; }
  main { max-width: 960px; margin: 0 auto; padding: 30px 20px 64px; }
  h1 {
    margin: 0 0 6px;
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.4;
  }
  h1 span { margin-left: 8px; font-size: 15px; font-weight: 400; color: var(--ink3); }
  .lead { margin: 0 0 22px; font-size: 14px; color: var(--ink2); }
  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 320px; padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .placeholder { font-size: 14px; color: var(--ink3); text-align: center; }
  .note {
    margin: 22px 0 0; padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--ink3);
  }
  .note b { color: var(--ink2); }
  @media (max-width: 640px) { h1 { font-size: 24px; } }
</style>
</head>
<body>

<header class="bar">
  <a href="../../../index.html#ch=【章号】" target="_top">← 返回第【章号】章目录</a>
  <span class="crumb">【年级】 · 第【章号】章【章名】</span>
</header>

<main>
  <h1>【节名】 <span>【副标题】</span></h1>
  <p class="lead">一句话说明学生在这个模型里可以怎么操作、能观察到什么。</p>

  <!-- 交互区：SVG / Canvas / HTML 均可 -->
  <section class="stage">
    <p class="placeholder">交互区域（把模型放在这里）</p>
  </section>

  <p class="note"><b>结论：</b>用一两句话写下本节希望学生自己发现的知识点。</p>
</main>

<script>
  // 交互逻辑写在这里，禁止引入外部脚本
  // 变量、事件监听、渲染函数都放在 IIFE 里，避免污染
</script>
</body>
</html>

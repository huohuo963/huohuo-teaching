<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【章节名】 | 【年级】</title>
<!--
=================================================================
 单文件章节模型模板
 1. 复制本文件到 models/<年级目录>/<章号>-<英文名>.html
    年级目录：7a 七上 / 7b 七下 / 8a 八上 / 8b 八下 / 9a 九上 / 9b 九下
    示例：models/8b/17-pythagorean.html
 2. 样式、脚本全部写在本文件内，不要引用外部 CDN、外部图片；
    确需图片时使用 base64 内联，保证双击即可离线运行。
 3. 完成后，在 js/chapters.js 中把对应章节的 ready 改为 true。
 4. 几个通用要求：适配手机、触摸可操作、正文使用中文、
    顶部保留「返回章节列表」链接（../../index.html）。
=================================================================
-->
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1e2430; --ink2:#5a6474; --ink3:#8b94a3; --line:#e4e8ef; --brand:#2f6fed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .bar a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .bar .crumb { color: var(--ink3); }
  main { max-width: 960px; margin: 0 auto; padding: 30px 20px 64px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  h1 span { margin-left: 8px; font-size: 16px; font-weight: 500; color: var(--ink3); }
  .lead { margin: 0 0 22px; font-size: 14px; color: var(--ink2); }
  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 320px; padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(20,30,50,.05), 0 10px 28px rgba(20,30,50,.06);
  }
  .placeholder { font-size: 14px; color: var(--ink3); text-align: center; }
  .note {
    margin: 22px 0 0; padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--ink3);
  }
  .note b { color: var(--ink2); }
  @media (max-width: 640px) { h1 { font-size: 22px; } }
</style>
</head>
<body>

<header class="bar">
  <a href="../../index.html">← 返回章节列表</a>
  <span class="crumb">【年级】 · 第【章号】章【章节名】</span>
</header>

<main>
  <h1>【标题】 <span>【副标题】</span></h1>
  <p class="lead">一句话说明学生在这个模型里可以怎么操作、能观察到什么。</p>

  <!-- 交互区：SVG / Canvas / HTML 均可 -->
  <section class="stage">
    <p class="placeholder">交互区域（把模型放在这里）</p>
  </section>

  <p class="note"><b>结论：</b>用一两句话写下本章希望学生自己发现的知识点。</p>
</main>

<script>
  // 交互逻辑写在这里，禁止引入外部脚本
  // window 级变量、事件监听、渲染函数都放在 IIFE 里，避免污染
</script>
</body>
</html>

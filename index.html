<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="火火教学 · 初中数学模型：七至九年级 29 章单文件交互模型，可离线运行。">
<title>火火教学 · 初中数学模型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Cpath d='M32 14 50 50H14z' fill='none' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero__inner">
    <div class="hero__text">
      <p class="eyebrow">初中数学模型 · 初中三年 · 二十九章</p>
      <h1>火火教学</h1>
      <p class="lede">把每一章的知识点做成可拖拽、可操作的交互模型。<br>单文件、可离线、手机也能用。</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat__num" id="statReady">0</span><span class="stat__label">已上线</span></div>
      <div class="stat"><span class="stat__num" id="statTotal">0</span><span class="stat__label">总章节</span></div>
      <div class="stat"><span class="stat__num" id="statPercent">0%</span><span class="stat__label">完成度</span></div>
    </div>
  </div>
</header>

<nav class="grade-nav" aria-label="年级导航">
  <div class="grade-nav__inner" id="gradeNav"></div>
</nav>

<main class="page" id="sections"></main>

<footer class="footer">
  <div class="footer__inner">
    <span>文件约定：<code>models/年级目录/章号-英文名.html</code>　·　新增章节见仓库 README</span>
    <span>火火教学 · 单文件交互课件</span>
  </div>
</footer>

<div class="viewer" id="viewer" hidden>
  <div class="viewer__bar">
    <div class="viewer__title"><span class="chip" id="viewerTag"></span><span id="viewerTitle"></span></div>
    <div class="viewer__actions">
      <a class="btn btn--ghost" id="viewerNew" href="#" target="_blank" rel="noopener">新窗口打开</a>
      <button class="btn" id="viewerClose" type="button">关闭</button>
    </div>
  </div>
  <div class="viewer__frame"><iframe id="viewerFrame" title="章节模型"></iframe></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/chapters.js"></script>
<script src="js/site.js"></script>
</body>
</html>
